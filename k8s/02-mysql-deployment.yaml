apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: bijouterie
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: aissata519/bijouterie-mysql:v0 
        ports:
        - containerPort: 3306
          name: mysql
        resources: 
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-password
        - name: MYSQL_USER
          value: "bijoux"
        - name: MYSQL_DATABASE
          value: "bijouterie"
